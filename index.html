:root{--bg:#03090c;--sf:#111216;--tx:#d6f5f7;--mu:#5f9aa0;--ac:#18b9c6;--ac2:#7ff0f6;--ed:#080b10;--edt:#d8f7ff;--gl:rgba(17,18,22,.78);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:'Rajdhani',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:17px;font-weight:500;display:flex;flex-direction:column;overflow:hidden}
body::before{content:"";position:fixed;left:0;top:0;width:100%;height:100vh;height:100lvh;z-index:-1;pointer-events:none;background:
radial-gradient(circle at 8% 22%,rgba(60,220,230,.55) 0 2px,transparent 3px),radial-gradient(circle at 90% 14%,rgba(60,220,230,.4) 0 3px,transparent 4px),radial-gradient(circle at 18% 78%,rgba(60,220,230,.35) 0 2px,transparent 3px),radial-gradient(circle at 80% 70%,rgba(60,220,230,.45) 0 2px,transparent 3px),radial-gradient(circle at 55% 40%,rgba(60,220,230,.3) 0 2px,transparent 3px),radial-gradient(circle at 36% 92%,rgba(60,220,230,.4) 0 3px,transparent 4px),
radial-gradient(ellipse 75% 55% at 50% 8%,rgba(0,190,200,.42),transparent 70%),radial-gradient(ellipse 60% 45% at 15% 100%,rgba(0,150,170,.25),transparent 70%),radial-gradient(ellipse 55% 40% at 100% 85%,rgba(0,140,165,.22),transparent 70%),
linear-gradient(rgba(30,200,210,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(30,200,210,.07) 1px,transparent 1px);background-size:auto,auto,auto,auto,auto,auto,auto,auto,auto,44px 44px,44px 44px}
button,input,select{font:inherit;color:inherit}
.btn{position:relative;overflow:hidden;border:1px solid rgba(24,185,198,.28);background:linear-gradient(145deg,#1d2027,#0e0f13);color:#7fe3ea;border-radius:16px;padding:8px 14px;cursor:pointer;box-shadow:0 8px 18px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.07);font-weight:600;white-space:nowrap;transition:transform .15s,filter .15s}
.btn:hover{transform:translateY(-1px);filter:brightness(1.12)}
.btn.pri{--g:24,185,198}.btn.grn{--g:34,196,122}#hb{--g:245,180,42}
.btn::after{content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;pointer-events:none;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-22deg);opacity:0}
.btn.pri::after,.btn.grn::after,#hb::after{opacity:1;animation:sweep 3.6s ease-in-out infinite}
.btn:hover::after{opacity:1;animation:sweep .9s ease}
.btn.pri,.btn.grn,#hb{animation:glow 2.8s ease-in-out infinite}
@keyframes sweep{0%{left:-70%}55%,100%{left:130%}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 0 rgba(var(--g),0))}50%{filter:drop-shadow(0 0 11px rgba(var(--g),.6))}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes flt{0%,100%{transform:translateY(1.5px)}50%{transform:translateY(-2.5px)}}
@keyframes wig{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes up{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
@keyframes rip{from{transform:scale(1);opacity:.8}to{transform:scale(1.9);opacity:0}}
@keyframes ld{to{width:100%}}
@keyframes burst{from{transform:rotate(var(--a)) translateX(36px) scale(1);opacity:1}to{transform:rotate(var(--a)) translateX(110px) scale(.3);opacity:0}}
.orb{position:relative;width:var(--o,68px);height:var(--o,68px);flex:none}
.orb i{position:absolute;border-radius:50%}
.orb .r1{inset:0;border:2px dashed currentColor;opacity:.75;animation:spin 12s linear infinite}
.orb .r1::after{content:"";position:absolute;right:-5px;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:currentColor;box-shadow:0 0 10px currentColor}
.orb .r2{inset:11%;border:2px dotted currentColor;opacity:.55;animation:spin 18s linear infinite reverse}
.orb .tile{position:absolute;inset:24%;border-radius:28%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.34);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 4px 10px rgba(0,0,0,.18)}
.orb .tile svg{width:60%;height:60%}
.orb .up svg{animation:flt 2.4s ease-in-out infinite}
.orb .wig svg{animation:wig 2.8s ease-in-out infinite}
.orb.xl{--o:150px;color:#18b9c6}
.orb.xl .r2{border-color:#f5b42a;color:#f5b42a}
.orb.xl .tile{background:linear-gradient(145deg,#1d2027,#0e0f13);box-shadow:0 12px 30px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.08)}
#splash{position:fixed;inset:0;z-index:90;background:#03090c;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .55s}
#splash::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 70% 50% at 50% 40%,rgba(0,190,200,.35),transparent 70%),linear-gradient(rgba(30,200,210,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(30,200,210,.07) 1px,transparent 1px);background-size:auto,44px 44px,44px 44px}
#splash.out{opacity:0;pointer-events:none}
#splash>*{position:relative}
.sn{font:800 36px 'Outfit',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;letter-spacing:-.5px}
.sn .a{background:linear-gradient(180deg,#fff,#cfdcff);-webkit-background-clip:text;background-clip:text;color:transparent}
.sn .b{background:linear-gradient(180deg,#4f8bff,#2f6df0);-webkit-background-clip:text;background-clip:text;color:transparent}
.pb{width:190px;height:5px;border-radius:9px;background:#0c1418;overflow:hidden}
.pb i{display:block;height:100%;width:0;background:linear-gradient(90deg,#18b9c6,#7ff0f6);box-shadow:0 0 10px #18b9c6;animation:ld 2.2s ease forwards}
#splash small{color:var(--mu);font-weight:600}
.brand{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:12px;display:flex;align-items:center;gap:7px;padding:5px 12px 5px 5px;border-radius:999px;background:var(--gl);border:1px solid rgba(24,185,198,.25);box-shadow:0 6px 14px rgba(0,0,0,.55)}
.brand .bl{width:26px;height:26px;border-radius:9px;background:linear-gradient(145deg,#1d2027,#0e0f13);display:flex;align-items:center;justify-content:center}
.brand .bl svg{width:16px;height:16px}
.brand b{font:700 13px 'Outfit',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:linear-gradient(90deg,#fff,#4f8bff);-webkit-background-clip:text;background-clip:text;color:transparent}
#ok{position:fixed;inset:0;z-index:80;display:none;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:rgba(2,9,12,.9);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#ok.on{display:flex}
.tk{position:relative;width:120px;height:120px;margin-bottom:12px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#7ff0f6,#18b9c6 55%,#0b8793);box-shadow:0 0 44px rgba(24,185,198,.65),inset 0 2px 0 rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
.tk::after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid #18b9c6;animation:rip 1s .3s ease-out both}
.tk svg{width:64px;height:64px}
.tk path{stroke:#022a2f;stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:30;stroke-dashoffset:30;animation:draw .5s .35s ease forwards}
.bu{position:absolute;inset:0}
.bu i{position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c);animation:burst .9s .45s ease-out both}
#ok h2{margin:0;font:800 36px 'Outfit',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:linear-gradient(180deg,#fff,#cfdcff);-webkit-background-clip:text;background-clip:text;color:transparent;animation:up .5s .6s both}
#ok p{margin:0;color:#7fe3ea;font-weight:700;font-size:20px;animation:up .5s .75s both}
#ok small{color:var(--mu);font-size:15px;animation:up .5s .9s both}
#cb{justify-content:center}
.hgrid{display:grid;grid-template-columns:1fr;gap:16px;width:min(560px,100%)}
.hcard{position:relative;display:flex;flex-direction:column;align-items:center;gap:7px;padding:16px 14px 14px;border-radius:26px;cursor:pointer;text-align:center;font:inherit;overflow:hidden;transition:transform .2s}
#hc.hcard,#hb.hcard{--n:34,211,238;color:#d6f5f7;text-shadow:none;border:1px solid rgba(var(--n),.55);background:linear-gradient(160deg,rgba(var(--n),.16),rgba(5,12,16,.94) 48%);box-shadow:inset 0 0 0 1px rgba(var(--n),.08),0 0 26px rgba(var(--n),.26),0 16px 32px rgba(0,0,0,.6);animation:none}
#hb.hcard{--n:245,180,42}
.hcard:hover{transform:translateY(-3px)}
.hcard:active{transform:scale(.98)}
.hcard::before{content:"";position:absolute;top:0;left:-70%;width:40%;height:100%;pointer-events:none;background:linear-gradient(100deg,transparent,rgba(var(--n),.2),transparent);transform:skewX(-22deg);animation:sweep 4.2s ease-in-out infinite}
.bdg{padding:3px 12px;border-radius:999px;font-size:12px;font-weight:700;border:1px solid rgba(var(--n),.6);color:rgb(var(--n));background:rgba(var(--n),.1);box-shadow:0 0 12px rgba(var(--n),.3)}
.ct{font:800 25px 'Outfit',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;letter-spacing:.5px;color:#fff;margin-top:4px;text-shadow:0 0 16px rgba(var(--n),.75)}
.ln{width:34px;height:2px;border-radius:2px;background:rgb(var(--n));box-shadow:0 0 10px rgb(var(--n));animation:lnp 2.2s ease-in-out infinite}
.art{position:relative;width:150px;height:134px;margin:6px 0 2px;display:flex;align-items:center;justify-content:center}
.art svg{position:relative;filter:drop-shadow(0 0 8px rgba(var(--n),.55))}
.rg{position:absolute;left:50%;top:50%;width:128px;height:128px;margin:-64px;border:1.5px dashed rgba(var(--n),.55);border-radius:50%;animation:spin 16s linear infinite}
.rg::after,.rg::before{content:"";position:absolute;width:8px;height:8px;border-radius:50%;background:rgb(var(--n));box-shadow:0 0 10px rgb(var(--n))}
.rg::after{right:-4px;top:50%;margin-top:-4px}

var KEY='codingchanger.v1',S={projects:[],cur:null,file:null,dirty:false};
var SCR=['home','proj','ed'];
function starter(n){return [{name:'index.html',type:'text',at:Date.now(),content:'<!DOCTYPE html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n<title>'+esc(n)+'</title>\n<style>\n  body{font-family:system-ui,sans-serif;text-align:center;padding:40px;background:#eef1f8;color:#2b2f45}\n  button{border:0;padding:12px 22px;border-radius:14px;background:#18b9c6;color:#fff;font-size:16px}\n</style>\n</head>\n<body>\n  <h1>Hello, World!</h1>\n  <button id="btn">Click me</button>\n  <p id="out"></p>\n<script>\n  var n=0;\n  document.getElementById("btn").onclick=function(){\n    n++;\n    document.getElementById("out").textContent="Clicks: "+n;\n  };\n</'+'script>\n</body>\n</html>'}]}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function uid(){return 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function load(){try{var r=localStorage.getItem(KEY);if(!r&&window.CodingChanger&&CodingChanger.loadProjects)r=CodingChanger.loadProjects();if(r){var d=JSON.parse(r);if(d&&d.projects)S.projects=d.projects}}catch(e){}}
function persist(){try{var j=JSON.stringify({projects:S.projects});localStorage.setItem(KEY,j);try{if(window.CodingChanger&&CodingChanger.saveProjects)CodingChanger.saveProjects(j)}catch(x){}return true}catch(e){toast('Could not save (storage may be full)');return false}}
function P(){return S.projects.filter(function(p){return p.id===S.cur})[0]}
function F(p,n){return p.files.filter(function(f){return f.name===n})[0]}
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove('on')},2600)}
function show(id){SCR.forEach(function(s){$(s).classList.toggle('on',s===id)});if(id==='home')homeList();if(id==='proj')renderProj()}
function ask(title,val,cb){$('mt').textContent=title;var i=$('mi');i.value=val||'';$('md').classList.add('on');setTimeout(function(){i.focus();i.select()},30);
  function done(ok){$('md').classList.remove('on');$('mo').onclick=$('mc').onclick=i.onkeydown=null;if(ok&&i.value.trim())cb(i.value.trim())}
  $('mo').onclick=function(){done(true)};$('mc').onclick=function(){done(false)};i.onkeydown=function(e){if(e.key==='Enter')done(true);if(e.key==='Escape')done(false)}}
var DBG='(function(){var D=document.currentScript.textContent;function s(m){try{var d=document.getElementById("__cce");if(!d){d=document.createElement("div");d.id="__cce";d.style.cssText="position:fixed;left:0;right:0;bottom:0;max-height:40%;overflow:auto;z-index:2147483647;background:#3a0510;color:#ffb3bd;font:12px/1.4 monospace;padding:6px 10px;white-space:pre-wrap";(document.body||document.documentElement).appendChild(d)}d.textContent+=m+"\\n"}catch(e){}}addEventListener("error",function(e){s("\u2717 "+e.message+(e.lineno?" (line "+e.lineno+")":""))});addEventListener("unhandledrejection",function(e){s("\u2717 "+(e.reason&&e.reason.message||e.reason))});try{var o=Object.getOwnPropertyDescriptor(HTMLIFrameElement.prototype,"srcdoc");Object.defineProperty(HTMLIFrameElement.prototype,"srcdoc",{configurable:true,get:o.get,set:function(v){o.set.call(this,typeof v==="string"?v.replace(/<head[^>]*>/i,function(m){return m+"<scr"+"ipt>"+D+"</scr"+"ipt>"}):v)}})}catch(e){}})()';
function inject(h){var t='<scr'+'ipt>'+DBG+'</scr'+'ipt>';return /<head[^>]*>/i.test(h)?h.replace(/<head[^>]*>/i,function(m){return m+t}):/<html[^>]*>/i.test(h)?h.replace(/<html[^>]*>/i,function(m){return m+t}):t+h}
function find(p,n){n=n.replace(/^(\.\/|\/)+/,'').split(/[?#]/)[0];return F(p,n)}
function build(p,fn){
  var idx=(fn&&F(p,fn))||F(p,'index.html')||p.files.filter(function(f){return /\.html?$/i.test(f.name)})[0];
  if(!idx)return '<p style="font-family:sans-serif;padding:24px">Add a file named index.html.</p>';
  var h=idx.content;
  h=h.replace(/<link[^>]*href=["']([^"']+)["'][^>]*>/gi,function(m,n){var x=find(p,n);return x&&x.type==='text'&&(/stylesheet/i.test(m)||/\.css$/i.test(n))?'<style>'+x.content+'</style>':m});
  h=h.replace(/<script([^>]*?)src=["']([^"']+)["']([^>]*)><\/script>/gi,function(m,a,n,b){var x=find(p,n);return x&&x.type==='text'?'<script'+a+b+'>'+x.content.replace(/<\/script/gi,'<\\/script')+'</'+'script>':m});
  h=h.replace(/(src|href)=["']([^"']+)["']/gi,function(m,a,n){var x=find(p,n);if(x&&x.type==='data')return a+'="'+x.content+'"';if(x&&x.type==='text'&&/\.svg$/i.test(x.name))return a+'="data:image/svg+xml;charset=utf-8,'+encodeURIComponent(x.content)+'"';return m});
  return h}
function projWrap(p,dbg){var pg={},hs=p.files.filter(function(f){return /\.html?$/i.test(f.name)});hs.forEach(function(f){pg[f.name]=build(p,f.name)});if(!pg['index.html'])pg['index.html']=hs.length?pg[hs[0].name]:build(p);var w=wrap(p.name,APPICON,pg);return dbg?inject(w):w}
function mkb(t,f,c){var b=document.createElement('button');b.className='btn '+(c||'');b.textContent=t;b.onclick=function(e){e.stopPropagation();f()};return b}
function runHtml(h){$('ff').srcdoc=h;$('fs').classList.add('on');try{if($('fs').requestFullscreen)$('fs').requestFullscreen().catch(function(){})}catch(e){}}
function closeFs(){$('fs').classList.remove('on');$('ff').srcdoc='';try{if(document.fullscreenElement)document.exitFullscreen()}catch(e){}}
function dlBlob(b,n,ext){var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=(n.replace(/[^\w-]+/g,'_')||'app')+ext;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},4000);toast('Downloading file...')}

/* home */
function homeList(){var el=$('hl');el.innerHTML='';
  if(!S.projects.length){el.innerHTML='<div class="lb2">Saved projects<br><small>No saved projects yet</small></div>';return}
  var t=document.createElement('div');t.className='lb2';t.textContent='Saved projects';el.appendChild(t);
  var w=document.createElement('div');w.className='chips';
  S.projects.forEach(function(p){var c=document.createElement('div');c.className='chip';
    var o=document.createElement('button');o.textContent=p.name;o.title='Open '+p.name;o.onclick=function(){S.cur=p.id;show('proj')};
    var x=document.createElement('button');x.className='x';x.textContent='⋮';x.title='More options';x.setAttribute('aria-label','Options for '+p.name);
    x.onclick=function(e){e.stopPropagation();menu(x,p)};
    c.appendChild(o);c.appendChild(x);w.appendChild(c)});
  el.appendChild(w)}

function closeMenu(){$('mn').classList.remove('on')}
function menu(btn,p){var m=$('mn');m.innerHTML='';
  [['Open',function(){S.cur=p.id;show('proj')}],
   ['Rename',function(){ask('Rename project',p.name,function(n){p.name=n;persist();homeList()})}],
   ['Duplicate',function(){var c=JSON.parse(JSON.stringify(p));c.id=uid();c.name=p.name+' copy';S.projects.push(c);persist();homeList();toast('Project duplicated')}],
